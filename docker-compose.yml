# Production (EC2): Postgres + blue/green web. Deploy must start `postgres` before web
# (`docker compose up -d postgres`); CI uses --no-deps on web-only rolls.
#
# Container logs: json-file driver with rotation (~50 MB cap per service: 5 × 10 MB).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

x-web: &web
  image: ${ECR_REGISTRY:-825125930465.dkr.ecr.ap-south-2.amazonaws.com}/${ECR_REPOSITORY:-linkedin-automation}:${IMAGE_TAG:-latest}
  env_file:
    - .env
  environment:
    NODE_ENV: production
    HOSTNAME: 0.0.0.0
    PORT: "3000"
    DATABASE_HOST: postgres
    DATABASE_SSL: "false"
    NEXTAUTH_URL: ${NEXTAUTH_URL:-https://linkedin.anytimerequest.com}
    NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://linkedin.anytimerequest.com}
  depends_on:
    postgres:
      condition: service_healthy
  logging: *default-logging
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
      ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s

services:
  postgres:
    image: postgres:16-alpine
    container_name: linkedin-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkedin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-linkedin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  web-blue:
    <<: *web
    container_name: linkedin-web-blue
    ports:
      - "127.0.0.1:3002:3000"

  web-green:
    <<: *web
    container_name: linkedin-web-green
    ports:
      - "127.0.0.1:3003:3000"

volumes:
  postgres_data:
