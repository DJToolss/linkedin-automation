x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    image: 825125930465.dkr.ecr.ap-south-2.amazonaws.com/linkedin-automation:latest

    env_file:
      - .env

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"

      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://linkedin.anytimerequest.com}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://linkedin.anytimerequest.com}

    ports:
      - "3000:3000"

    restart: unless-stopped

    init: true

    stop_grace_period: 30s

    logging: *default-logging

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s