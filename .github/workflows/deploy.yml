name: Deploy (Blue/Green)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkedin-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: linkedin-automation

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: echo "version=1.0.${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.version.outputs.version }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          AUTH_URL="${AUTH_URL:-$NEXTAUTH_URL}"
          DOCKER_BUILDKIT=1 docker build \
            --build-arg NEXTAUTH_URL \
            --build-arg AUTH_URL \
            --build-arg NEXT_PUBLIC_APP_URL \
            --secret id=nextauth_secret,env=NEXTAUTH_SECRET \
            -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:sha-$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy using existing AWS Compose configuration
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.version }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          BLUE_SERVICE: ${{ vars.DEPLOY_BLUE_SERVICE || 'web-blue' }}
          GREEN_SERVICE: ${{ vars.DEPLOY_GREEN_SERVICE || 'web-green' }}
          BLUE_PORT: ${{ vars.DEPLOY_BLUE_PORT || '3002' }}
          GREEN_PORT: ${{ vars.DEPLOY_GREEN_PORT || '3003' }}
          UPSTREAM_FILE: ${{ vars.DEPLOY_UPSTREAM_FILE || '/opt/linkedin/nginx_upstreams.conf' }}
          UPSTREAM_NAME: ${{ vars.DEPLOY_UPSTREAM_NAME || 'linkedin_web_live' }}
          VERIFY_URL: ${{ vars.DEPLOY_VERIFY_URL || 'https://linkedin.anytimerequest.com' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          envs: IMAGE_TAG,ECR_REGISTRY,ECR_REPOSITORY,AWS_REGION,BLUE_SERVICE,GREEN_SERVICE,BLUE_PORT,GREEN_PORT,UPSTREAM_FILE,UPSTREAM_NAME,VERIFY_URL
          script: |
            bash -se <<'DEPLOY_SCRIPT'
            set -euo pipefail
            DEPLOY_USER=$(id -un)
            DEPLOY_GROUP=$(id -gn)
            sudo -n test -d /opt/linkedin || { echo "The deployment directory must exist and $DEPLOY_USER needs passwordless sudo"; exit 1; }
            sudo -n chown "$DEPLOY_USER:$DEPLOY_GROUP" /opt/linkedin
            sudo -n chmod u+rwx /opt/linkedin
            cd /opt/linkedin
            sudo -n touch .deploy.lock
            sudo -n chown "$DEPLOY_USER:$DEPLOY_GROUP" .deploy.lock
            sudo -n chmod u+rw .deploy.lock
            exec 9>.deploy.lock
            flock -n 9 || { echo "Another deployment is running"; exit 1; }

            : "${VERIFY_URL:?Set DEPLOY_VERIFY_URL to the public HTTPS origin}"
            VERIFY_URL="${VERIFY_URL%/login}"
            VERIFY_URL="${VERIFY_URL%/}"
            [[ "$VERIFY_URL" =~ ^https://[^/]+$ ]] || { echo "DEPLOY_VERIFY_URL must be https://your-domain"; exit 1; }
            [[ "$UPSTREAM_NAME" =~ ^[a-zA-Z_][a-zA-Z0-9_]*$ ]]
            [[ "$BLUE_PORT" =~ ^[0-9]+$ && "$GREEN_PORT" =~ ^[0-9]+$ && "$BLUE_PORT" != "$GREEN_PORT" ]]
            [ "$BLUE_SERVICE" != "$GREEN_SERVICE" ]
            export IMAGE_TAG ECR_REGISTRY ECR_REPOSITORY

            SERVICES=$(docker compose config --services)
            for SERVICE in "$BLUE_SERVICE" "$GREEN_SERVICE"; do
              printf '%s\n' "$SERVICES" | grep -Fxq "$SERVICE" || { echo "Missing Compose service: $SERVICE"; exit 1; }
            done
            sudo test -f "$UPSTREAM_FILE" || { echo "Configure the Nginx upstream file first: $UPSTREAM_FILE"; exit 1; }
            sudo nginx -t
            NGINX_CONFIG=$(sudo nginx -T 2>&1)
            printf '%s\n' "$NGINX_CONFIG" | grep -Fq "# configuration file $UPSTREAM_FILE:" || { echo "Nginx must include $UPSTREAM_FILE"; exit 1; }
            printf '%s\n' "$NGINX_CONFIG" | grep -Eq "proxy_pass[[:space:]]+http://$UPSTREAM_NAME;" || { echo "Nginx must proxy to $UPSTREAM_NAME"; exit 1; }

            HAS_BLUE=false
            HAS_GREEN=false
            sudo grep -Eq "server[[:space:]]+127\.0\.0\.1:$BLUE_PORT[[:space:]]*;" "$UPSTREAM_FILE" && HAS_BLUE=true
            sudo grep -Eq "server[[:space:]]+127\.0\.0\.1:$GREEN_PORT[[:space:]]*;" "$UPSTREAM_FILE" && HAS_GREEN=true
            if [ "$HAS_BLUE" = true ] && [ "$HAS_GREEN" = false ]; then
              OLD_SERVICE="$BLUE_SERVICE"
              TARGET_SERVICE="$GREEN_SERVICE"
              TARGET_PORT="$GREEN_PORT"
            elif [ "$HAS_GREEN" = true ] && [ "$HAS_BLUE" = false ]; then
              OLD_SERVICE="$GREEN_SERVICE"
              TARGET_SERVICE="$BLUE_SERVICE"
              TARGET_PORT="$BLUE_PORT"
            else
              echo "Upstream must point to exactly one configured blue/green port"
              exit 1
            fi

            VERIFY_HOST=${VERIFY_URL#https://}
            VERIFY_HOST=${VERIFY_HOST%%/*}
            check_nginx() {
              NGINX_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 --resolve "$VERIFY_HOST:443:127.0.0.1" "$VERIFY_URL" || true)
              [ "$NGINX_STATUS" = 200 ]
            }
            check_nginx || { echo "Current Nginx endpoint is unhealthy; deployment aborted (HTTP ${NGINX_STATUS:-000} from $VERIFY_URL)"; exit 1; }

            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            EXPECTED_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            RESOLVED_IMAGE=$(docker compose config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"][sys.argv[1]]["image"])' "$TARGET_SERVICE")
            [ "$RESOLVED_IMAGE" = "$EXPECTED_IMAGE" ] || { echo "Compose target image must resolve to $EXPECTED_IMAGE; use IMAGE_TAG in the existing Compose file"; exit 1; }
            docker compose pull "$TARGET_SERVICE"

            BACKUP=$(mktemp /opt/linkedin/nginx-upstream.XXXXXX)
            sudo cp "$UPSTREAM_FILE" "$BACKUP"
            SWITCHED=false
            rollback() {
              STATUS=$?
              trap - EXIT
              if [ "$STATUS" -ne 0 ]; then
                docker compose logs --no-color --tail=100 "$TARGET_SERVICE" || true
                if [ "$SWITCHED" = true ]; then
                  if ! { sudo cp "$BACKUP" "$UPSTREAM_FILE" && sudo nginx -t && sudo systemctl reload nginx && check_nginx; }; then
                    echo "Rollback failed; both containers retained. Backup: $BACKUP"
                    exit "$STATUS"
                  fi
                fi
                docker compose stop "$TARGET_SERVICE" || true
              fi
              sudo rm -f "$BACKUP"
              exit "$STATUS"
            }
            trap rollback EXIT

            docker compose up -d --no-deps --no-build "$TARGET_SERVICE"
            HEALTHY=false
            for ATTEMPT in $(seq 1 30); do
              STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:$TARGET_PORT/api/health" || true)
              if [ "$STATUS" = 200 ]; then
                HEALTHY=true
                break
              fi
              sleep 4
            done
            [ "$HEALTHY" = true ] || { echo "Target failed health check"; exit 1; }

            SWITCHED=true
            printf 'upstream %s { server 127.0.0.1:%s; }\n' "$UPSTREAM_NAME" "$TARGET_PORT" | sudo tee "$UPSTREAM_FILE" >/dev/null
            sudo nginx -t
            sudo systemctl reload nginx
            sleep 5
            check_nginx || { echo "Nginx verification failed (HTTP ${NGINX_STATUS:-000} from $VERIFY_URL)"; exit 1; }

            trap - EXIT
            sudo rm -f "$BACKUP"
            sleep 30
            docker compose stop "$OLD_SERVICE"
            docker compose rm -f "$OLD_SERVICE" || true

            # Drop unused containers/images left by prior blue-green rolls.
            # Running $TARGET_SERVICE (and its image) are kept.
            echo "Pruning unused Docker containers and images…"
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -f || true

            echo "Deployed $EXPECTED_IMAGE to $TARGET_SERVICE (stopped+removed $OLD_SERVICE)"
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' || true
            DEPLOY_SCRIPT
