name: Deploy (Blue/Green)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkedin-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: linkedin-automation
  ECR_REGISTRY: 825125930465.dkr.ecr.ap-south-2.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: echo "version=1.0.${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.version.outputs.version }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          AUTH_URL="${AUTH_URL:-$NEXTAUTH_URL}"
          DOCKER_BUILDKIT=1 docker build \
            --build-arg NEXTAUTH_URL \
            --build-arg AUTH_URL \
            --build-arg NEXT_PUBLIC_APP_URL \
            --secret id=nextauth_secret,env=NEXTAUTH_SECRET \
            -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:sha-$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
          DOCKER_BUILDKIT=1 docker build --target migrator -t "$IMAGE:$IMAGE_TAG-migrate" .
          docker push "$IMAGE:$IMAGE_TAG-migrate"

      - name: Prune old images in ECR
        env:
          IMAGE_TAG: ${{ steps.version.outputs.version }}
          KEEP_COUNT: ${{ vars.ECR_KEEP_IMAGE_COUNT || '10' }}
        run: |
          set -euo pipefail
          REPO="$ECR_REPOSITORY"
          KEEP=$((KEEP_COUNT))
          [ "$KEEP" -ge 3 ] || KEEP=3

          mapfile -t TAGS < <(
            aws ecr describe-images --region "$AWS_REGION" --repository-name "$REPO" \
              --query 'sort_by(imageDetails,& imagePushedAt)[].imageTags[]' --output text \
            | tr '\t' '\n' | grep -E '^1\.0\.[0-9]+-[0-9]+$' || true
          )

          PROTECT=$(printf '%s\n' "$IMAGE_TAG" "latest" | sort -u)
          DELETE=()
          for TAG in "${TAGS[@]}"; do
            if printf '%s\n' "$PROTECT" | grep -Fxq "$TAG"; then
              continue
            fi
            DELETE+=("$TAG")
          done

          if [ "${#DELETE[@]}" -le "$KEEP" ]; then
            echo "ECR has ${#DELETE[@]} version tag(s) to consider; keeping all (limit $KEEP)."
            exit 0
          fi

          TO_REMOVE=("${DELETE[@]:0:${#DELETE[@]}-KEEP}")
          echo "Removing ${#TO_REMOVE[@]} old ECR tag(s): ${TO_REMOVE[*]}"
          for TAG in "${TO_REMOVE[@]}"; do
            aws ecr batch-delete-image --region "$AWS_REGION" --repository-name "$REPO" \
              --image-ids "imageTag=$TAG" >/dev/null || true
          done

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set -e
            sudo mkdir -p /opt/linkedin
            sudo chown "$(whoami):$(whoami)" /opt/linkedin
            sudo chmod 755 /opt/linkedin

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/opt/linkedin"

      - name: Execute remote deployment (blue/green)
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.version }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          BLUE_SERVICE: ${{ vars.DEPLOY_BLUE_SERVICE || 'web-blue' }}
          GREEN_SERVICE: ${{ vars.DEPLOY_GREEN_SERVICE || 'web-green' }}
          BLUE_PORT: ${{ vars.DEPLOY_BLUE_PORT || '3002' }}
          GREEN_PORT: ${{ vars.DEPLOY_GREEN_PORT || '3003' }}
          UPSTREAM_FILE: ${{ vars.DEPLOY_UPSTREAM_FILE || '/opt/linkedin/nginx_upstreams.conf' }}
          UPSTREAM_NAME: ${{ vars.DEPLOY_UPSTREAM_NAME || 'linkedin_web_live' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          envs: IMAGE_TAG,ECR_REGISTRY,ECR_REPOSITORY,AWS_REGION,BLUE_SERVICE,GREEN_SERVICE,BLUE_PORT,GREEN_PORT,UPSTREAM_FILE,UPSTREAM_NAME
          script: |
            set -e
            cd /opt/linkedin
            export IMAGE_TAG ECR_REGISTRY ECR_REPOSITORY AWS_REGION

            log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*"; }

            http_code() {
              local url="$1"
              local code
              code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "$url" 2>/dev/null || true)
              echo "${code:-000}"
            }

            container_for_service() {
              case "$1" in
                web-blue) echo linkedin-web-blue ;;
                web-green) echo linkedin-web-green ;;
                *) echo "unknown-$1"; return 1 ;;
              esac
            }

            write_upstream() {
              local port="$1"
              printf 'upstream %s { server 127.0.0.1:%s; }\n' "$UPSTREAM_NAME" "$port" | sudo tee "$UPSTREAM_FILE" >/dev/null
            }

            cleanup_web_slot() {
              local service="$1"
              docker compose stop "$service" 2>/dev/null || true
              docker compose rm -f "$service" 2>/dev/null || true
              local cname
              cname=$(container_for_service "$service") || return 0
              docker ps -aq --filter "name=^${cname}$" | xargs -r docker rm -f 2>/dev/null || true
            }

            log "Deploying IMAGE_TAG=$IMAGE_TAG"

            [[ "$UPSTREAM_NAME" =~ ^[a-zA-Z_][a-zA-Z0-9_]*$ ]]
            [[ "$BLUE_PORT" =~ ^[0-9]+$ && "$GREEN_PORT" =~ ^[0-9]+$ && "$BLUE_PORT" != "$GREEN_PORT" ]]
            [ "$BLUE_SERVICE" != "$GREEN_SERVICE" ]

            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            EXPECTED_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            log "Pulling $EXPECTED_IMAGE"
            docker pull "$EXPECTED_IMAGE"
            docker pull "$EXPECTED_IMAGE-migrate"

            RESOLVED_IMAGE=$(docker compose config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"][sys.argv[1]]["image"])' "$BLUE_SERVICE")
            [ "$RESOLVED_IMAGE" = "$EXPECTED_IMAGE" ] || {
              log "ERROR: compose image for $BLUE_SERVICE is $RESOLVED_IMAGE, expected $EXPECTED_IMAGE (set IMAGE_TAG in env)"
              exit 1
            }

            if ! sudo test -f "$UPSTREAM_FILE"; then
              log "Creating initial upstream file → blue port $BLUE_PORT"
              write_upstream "$BLUE_PORT"
            fi

            HAS_BLUE=false
            HAS_GREEN=false
            sudo grep -Eq "server[[:space:]]+127\.0\.0\.1:$BLUE_PORT[[:space:]]*;" "$UPSTREAM_FILE" && HAS_BLUE=true
            sudo grep -Eq "server[[:space:]]+127\.0\.0\.1:$GREEN_PORT[[:space:]]*;" "$UPSTREAM_FILE" && HAS_GREEN=true

            INITIAL=false
            if [ "$HAS_BLUE" = true ] && [ "$HAS_GREEN" = false ]; then
              OLD_SERVICE="$BLUE_SERVICE"
              TARGET_SERVICE="$GREEN_SERVICE"
              TARGET_PORT="$GREEN_PORT"
            elif [ "$HAS_GREEN" = true ] && [ "$HAS_BLUE" = false ]; then
              OLD_SERVICE="$GREEN_SERVICE"
              TARGET_SERVICE="$BLUE_SERVICE"
              TARGET_PORT="$BLUE_PORT"
            elif [ "$HAS_BLUE" = false ] && [ "$HAS_GREEN" = false ]; then
              log "Upstream has no blue/green port — first deploy to $GREEN_SERVICE"
              TARGET_SERVICE="$GREEN_SERVICE"
              TARGET_PORT="$GREEN_PORT"
              OLD_SERVICE="$BLUE_SERVICE"
              INITIAL=true
            else
              log "ERROR: upstream must point to exactly one of ports $BLUE_PORT or $GREEN_PORT"
              exit 1
            fi

            TARGET_CONTAINER=$(container_for_service "$TARGET_SERVICE")
            OLD_CONTAINER=$(container_for_service "$OLD_SERVICE")

            sudo cp "$UPSTREAM_FILE" "${UPSTREAM_FILE}.backup"

            log "Target=$TARGET_SERVICE ($TARGET_PORT), old=$OLD_SERVICE, initial=$INITIAL"
            cleanup_web_slot "$TARGET_SERVICE"

            log "Starting Postgres"
            docker compose up -d postgres
            POSTGRES_READY=false
            for i in $(seq 1 45); do
              if docker compose exec -T postgres pg_isready -q 2>/dev/null; then
                POSTGRES_READY=true
                break
              fi
              sleep 2
            done
            [ "$POSTGRES_READY" = true ] || { log "ERROR: Postgres not ready"; docker compose logs --tail=40 postgres || true; exit 1; }

            log "Running database migrations"
            if ! docker compose run --rm --no-deps db-migrate; then
              log "ERROR: database migration failed"
              exit 1
            fi

            log "Starting $TARGET_SERVICE"
            if ! docker compose up -d --no-deps --no-build "$TARGET_SERVICE"; then
              log "ERROR: failed to start $TARGET_SERVICE"
              docker compose logs --tail=80 "$TARGET_SERVICE" || true
              exit 1
            fi

            log "Waiting for health on 127.0.0.1:$TARGET_PORT/api/health"
            HEALTHY=false
            for i in $(seq 1 45); do
              CODE=$(http_code "http://127.0.0.1:${TARGET_PORT}/api/health")
              if [ "$CODE" = "200" ]; then
                HEALTHY=true
                log "Health OK (attempt $i)"
                break
              fi
              log "Health attempt $i/45: HTTP $CODE"
              sleep 4
            done
            if [ "$HEALTHY" != true ]; then
              log "ERROR: $TARGET_SERVICE failed health check"
              docker logs --tail=100 "$TARGET_CONTAINER" 2>&1 || true
              cleanup_web_slot "$TARGET_SERVICE"
              exit 1
            fi

            log "Switching nginx upstream to port $TARGET_PORT"
            write_upstream "$TARGET_PORT"
            sudo nginx -t
            sudo systemctl reload nginx

            if [ "$INITIAL" != true ] && docker ps -a --format '{{.Names}}' | grep -qx "$OLD_CONTAINER"; then
              log "Stopping old slot $OLD_SERVICE"
              docker compose stop "$OLD_SERVICE" 2>/dev/null || true
              docker compose rm -f "$OLD_SERVICE" 2>/dev/null || true
            fi

            log "Cleaning old local images (keep $IMAGE_TAG and latest)"
            REPO="$ECR_REGISTRY/$ECR_REPOSITORY"
            mapfile -t OLD_IDS < <(
              docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
                | grep "^${REPO}:" \
                | grep -v ":${IMAGE_TAG} " \
                | grep -v ':latest ' \
                | awk '{print $2}' \
                | sort -u
            )
            for id in "${OLD_IDS[@]:-}"; do
              [ -n "$id" ] || continue
              docker rmi "$id" 2>/dev/null || true
            done
            docker image prune -f >/dev/null || true

            if ! docker ps --format '{{.Names}}' | grep -qx "$TARGET_CONTAINER"; then
              log "ERROR: $TARGET_CONTAINER is not running after deploy"
              docker ps -a || true
              exit 1
            fi

            log "Deployment complete: $EXPECTED_IMAGE on $TARGET_SERVICE"
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
